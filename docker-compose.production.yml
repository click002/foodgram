volumes:
  postgres_data:
  static_value:
  media_value:

services:
  db:
    image: postgres:15
    container_name: foodgram-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: click002/foodgram_backend
    container_name: foodgram-backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_value:/app/static
      - media_value:/app/media
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 foodgram.wsgi"

  frontend:
    image: click002/foodgram_frontend
    container_name: foodgram-front
    command: cp -r /app/result_build/. /static/
    volumes:
      - static_value:/static
      - media_value:/media
    depends_on:
      - backend

  gateway:
    image: click002/foodgram_gateway
    container_name: foodgram-gateway
    env_file: .env
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_value:/usr/share/nginx/html
      - static_value:/static
      - media_value:/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
