[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
src_paths = backend
line_length = 79
force_sort_within_sections = True
known_firstparty = api,recipes,users
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
skip_glob = */migrations/*.py
multi_line_output = 4
include_trailing_comma = True
